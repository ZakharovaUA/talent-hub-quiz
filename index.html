<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Hub Quiz</title>
<style>
  :root{--blue:#003DA5;--navy:#00235F;--sky:#EAF1FD;--ink:#0B1B3A;--mut:#5a6988;--green:#1DA57A;--red:#D6455D;--gold:#F2B705;--acc:#003DA5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(900px 500px at 90% -10%,#2a6be0 0%,transparent 60%),linear-gradient(165deg,var(--blue) 0%,var(--navy) 100%);
    background-attachment:fixed;display:flex;flex-direction:column;align-items:center;padding:20px 16px;overflow-x:hidden}
  header{width:100%;max-width:1000px;display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:18px}
  .badge{width:46px;height:46px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  header h1{font-size:20px;font-weight:700;flex:1} header small{opacity:.75;display:block;font-weight:400;font-size:13px}
  .tool{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer}
  .tool:hover{background:rgba(255,255,255,.3)}
  main{width:100%;max-width:1000px} body.pl main,body.pl header{max-width:560px}
  .card{background:#fff;border-radius:22px;padding:32px;box-shadow:0 20px 50px rgba(0,20,70,.35);animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h2{color:var(--blue);font-size:32px;margin-bottom:10px} h3.bh{color:var(--blue);margin:20px 0 6px}
  p.sub{color:var(--mut);margin-bottom:20px;font-size:17px;line-height:1.5}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover:not(:disabled){background:#2a6be0;transform:translateY(-1px)}
  .btn.ghost{background:var(--sky);color:var(--blue)} .btn.ghost:hover:not(:disabled){background:#d3e3fb}
  .btn.sm{padding:8px 18px;font-size:15px} .btn.on{background:var(--green)} .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  input[type=text],textarea{width:100%;padding:14px 18px;border:2px solid #cfdcf3;border-radius:14px;font-size:17px;font-family:inherit;margin-bottom:16px;outline:none}
  textarea{min-height:110px;resize:vertical;margin-bottom:12px} input:focus,textarea:focus{border-color:var(--blue)}
  label.t{font-weight:600;color:var(--blue);display:block;margin-bottom:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{background:var(--acc);color:#fff;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;display:inline-block}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .mode{border:2px solid #d6e2f8;border-radius:18px;padding:22px;cursor:pointer;transition:.15s;background:#fff;text-align:left;font-family:inherit}
  .mode:hover{border-color:var(--blue);background:var(--sky);transform:translateY(-2px)}
  .mode h3{color:var(--blue);margin:6px 0} .mode p{color:var(--mut);font-size:15px;line-height:1.4} .mode .ic{font-size:30px}
  .blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:10px}
  .bk{display:flex;gap:10px;align-items:center;border:2px solid #d6e2f8;border-radius:14px;padding:10px 14px;cursor:pointer}
  .bk:has(input:checked){border-color:var(--acc);background:var(--sky)}
  .bk input{accent-color:var(--acc);width:18px;height:18px} .bk b{font-size:15px} .bk small{display:block;color:var(--mut);font-size:13px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--mut);font-weight:600}
  .bar{height:10px;background:var(--sky);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar>i{display:block;height:100%;background:var(--acc);width:100%;transition:width .2s linear} .bar.low>i{background:var(--red)}
  .q{font-size:28px;font-weight:700;margin-bottom:20px;line-height:1.3}
  .prompt{background:var(--ink);color:#e8f0fd;border-radius:14px;padding:16px 20px;font-family:Consolas,monospace;font-size:17px;line-height:1.55;margin-bottom:20px;border-left:6px solid var(--acc)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{display:flex;align-items:center;gap:14px;text-align:left;border:0;background:var(--oc,#0A4FC4);color:#fff;border-radius:16px;padding:18px 20px;font-size:19px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;width:100%;position:relative}
  button.opt:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px)}
  .opt .l{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--oc,#0A4FC4);display:grid;place-items:center;font-weight:800}
  .opt .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 12px;font-weight:700}
  .opt.sel{outline:4px solid var(--ink);outline-offset:2px}
  button.opt:disabled:not(.sel){opacity:.5} button.opt:disabled{cursor:default}
  .opt.correct{outline:5px solid var(--green);outline-offset:2px} .opt.correct::after{content:"✓";position:absolute;right:-8px;top:-10px;background:var(--green);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:18px}
  .opt.dim{opacity:.3}
  .ansbox{border:3px dashed var(--acc);border-radius:18px;padding:26px;text-align:center;font-size:22px;font-weight:700;color:var(--acc);line-height:1.4}
  .expl{margin-top:18px;background:var(--sky);border-left:5px solid var(--acc);border-radius:12px;padding:14px 18px;color:#243353;line-height:1.5;text-align:left}
  .next{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .intro{text-align:center;border-top:10px solid var(--acc)} .intro h2{color:var(--acc);font-size:38px}
  .bigico{font-size:84px;text-align:center;margin-bottom:6px}
  .kicker{color:var(--mut);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px}
  .mult{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;border-radius:99px;padding:6px 16px;margin-bottom:14px}
  .big{font-size:64px;font-weight:800;color:var(--blue);line-height:1} .res{font-size:80px;line-height:1.1}
  .code{font-size:72px;letter-spacing:12px;font-weight:800;color:var(--blue);line-height:1.1;margin:6px 0 14px}
  .linkbox{background:var(--sky);border-radius:14px;padding:12px 16px;word-break:break-all;font-family:Consolas,monospace;color:var(--navy);margin-bottom:10px}
  .pl{display:flex;flex-wrap:wrap;gap:8px} .pl span{background:var(--sky);padding:6px 14px;border-radius:99px;font-weight:600;color:var(--blue)} .pl span.off{opacity:.45}
  .alist{display:grid;gap:10px;margin-top:6px}
  .ac{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--sky);border-radius:14px;padding:12px 16px;line-height:1.4;text-align:left}
  .stand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 6px} .stand span{background:var(--sky);padding:6px 14px;border-radius:99px;font-weight:600;color:var(--blue)}
  .lb{margin:10px 0;text-align:left} .lbrow{display:flex;align-items:center;gap:10px;margin:7px 0;padding:4px 8px;border-radius:12px}
  .lbrow.me{background:var(--sky)} .rk{width:24px;font-weight:800;color:var(--blue)} .nm{width:160px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbbar{flex:1;height:14px;background:var(--sky);border-radius:99px;overflow:hidden} .lbrow.me .lbbar{background:#fff}
  .lbbar i{display:block;height:100%;background:linear-gradient(90deg,#4F8BE8,var(--blue));border-radius:99px;animation:grow .9s ease}
  @keyframes grow{from{width:0}} .plus{color:var(--green);font-weight:700;min-width:46px}
  .pr{position:relative;border:2px solid #d6e2f8;border-radius:12px;margin:8px 0;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;overflow:hidden;font-size:18px;text-align:left}
  .pr .pbar{position:absolute;left:0;top:0;bottom:0;background:var(--sky)} .pr span,.pr b{position:relative} .pr.mine{border-color:var(--blue)}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:28px 0}
  .pod{width:160px;border-radius:16px 16px 0 0;background:linear-gradient(180deg,#4F8BE8,var(--blue));color:#fff;text-align:center;padding:14px 8px}
  .pod .n{font-weight:700;word-break:break-word} .pod .s{font-size:26px;font-weight:800}
  .pod.p1{height:210px;background:linear-gradient(180deg,#ffd75e,var(--gold));color:var(--ink)} .pod.p2{height:160px} .pod.p3{height:120px;opacity:.92}
  .noms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0 6px}
  .nom{background:var(--sky);border-radius:16px;padding:14px;text-align:center}
  .nom .ni{font-size:34px} .nom b{display:block;color:var(--blue);margin:4px 0} .nom span{color:#243353;font-size:15px}
  footer{color:#fff;opacity:.6;font-size:13px;margin-top:20px;text-align:center}
  .conf{position:fixed;top:-30px;animation:fall linear forwards;pointer-events:none;z-index:130;border-radius:2px}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.8}}
  @media(max-width:640px){.opts{grid-template-columns:1fr}.card{padding:20px}.q{font-size:22px}h2{font-size:26px}.code{font-size:50px;letter-spacing:8px}.nm{width:100px}.opt{font-size:17px;padding:15px}}
</style>
</head>

<header>
  <div class="badge">TH</div>
  <h1>Talent Hub Quiz<small>Диджитал-команда • Тімбілдинг</small></h1>

<script>
/* ======================= НАЛАШТУВАННЯ ТА ПИТАННЯ ======================= */
const TITLE="Talent Hub Quiz", BASE_PTS=100, PFX="thqpp26-", MAXP=60;
const COL=['#0A4FC4','#0891C7','#6D5BD0','#D9822B'];
const L=['A','B','C','D'];

/* Налаштування зв'язку. TURN-сервер допомагає, коли мережа блокує пряме з'єднання.
   Це безкоштовний публічний сервер без гарантій. Якщо маєте власні дані TURN
   (наприклад, з metered.ca), замініть urls/username/credential нижче. */
const PCFG={config:{iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}
]}};

/* q — питання, a — варіанти, c — індекс правильного (0=A), poll:true — опитування без правильної відповіді,
   немає "a" — завдання з текстовою відповіддю (ведучий нараховує бали кнопкою 👍),
   h — підказка, e — пояснення, p — текст промпту, t — секунд */
const BLOCKS=[ {icon:"⚡",title:"Power Platform: свої люди",color:"#003DA5",t:20,mult:1,desc:"Розминка: інструменти, які ми знаємо й любимо.",qs:[  {q:"Що з цього НЕ входить до Power Platform?",a:["Power Apps","Power Automate","PowerPoint","Power BI"],c:2,e:"До Power Platform входять Power BI, Power Apps, Power Automate, Power Pages і Copilot Studio. PowerPoint — із Microsoft 365."},
  {q:"Для чого потрібен Power Automate?",a:["Для малювання діаграм","Для автоматизації рутинних дій між застосунками","Для зберігання файлів","Для відеодзвінків"],c:1,e:"Power Automate — автоматизація процесів і потоків між застосунками."},
  {q:"Як називається мова формул для розрахунку мір у Power BI?",a:["SQL","HTML","DAX","Python"],c:2,e:"DAX — Data Analysis Expressions."},
  {q:"Де в Power BI зазвичай готують і чистять дані?",a:["PowerShell","Power Query","Power Cord","Power Grid"],c:1,e:"Power Query: підключення, очищення та перетворення даних."},
  {q:"Яка мова формул використовується в Power Apps?",a:["Java","DAX","Power Fx","Swift"],c:2,h:"Вона схожа на формули Excel",e:"Power Fx — мова формул Power Apps, натхненна Excel."},
  {q:"Як називається сховище даних усередині Power Platform?",a:["Datacake","Dataverse","DataBox","Datapoint"],c:1,e:"Dataverse — сховище таблиць і даних для застосунків Power Platform."}
 ]},
 {icon:"📊",title:"Усе про дашборди",color:"#0891C7",t:20,mult:1,desc:"Візуалізація, фільтри й усе, що ламається перед демо.",qs:[
  {q:"Яка діаграма гірше за все читається, коли в ній 15 категорій?",a:["Стовпчаста","Лінійна","Таблиця","Кругова"],c:3,e:"У круговій діаграмі важко порівнювати багато часток на око."},
  {q:"Що найкраще показує динаміку по місяцях?",a:["Кругова діаграма","Карта","Лінійний графік","Воронка"],c:2,e:"Лінійний графік — класика для динаміки в часі."},
  {q:"Що таке слайсер?",a:["Діаграма-нарізка","Фільтр, яким користувач сам керує звітом","Тип даних","Тема оформлення"],c:1,e:"Слайсер — візуальний фільтр прямо на сторінці звіту."},
  {q:"Навіщо потрібен RLS (Row-Level Security)?",a:["Щоб пришвидшити звіт","Щоб кожен бачив лише свої дані","Щоб фарбувати рядки таблиці","Щоб стискати файли"],c:1,e:"RLS обмежує рядки даних, які бачить конкретний користувач."},
  {q:"Що найчастіше гальмує дашборд?",a:["Надто яскраві кольори","Довга назва звіту","Купа візуалів і важкі розрахунки на одній сторінці","Маленький монітор замовника"],c:2,e:"Чим легша сторінка, тим швидший звіт."},
  {q:"Що означає «оновлення за розкладом»?",a:["Звіт сам розсилається начальнику","Дані у звіті оновлюються самі в заданий час","Звіт сам змінює дизайн","Звіт видаляється за таймером"],c:1,e:"Дані підтягуються автоматично, без ручного натискання «Оновити»."}
 ]},
 {icon:"🧐",title:"Міф чи правда",color:"#6D5BD0",t:15,mult:1,desc:"Швидкі твердження: вірити чи ні?",qs:[
  {q:"Power BI Desktop можна завантажити безкоштовно.",a:["Правда","Міф"],c:0,e:"Desktop безкоштовний. Ліцензії потрібні для публікації та спільної роботи в Power BI Service (залежить від сценарію)."},
  {q:"Power BI Desktop працює на Mac як звичайний застосунок.",a:["Правда","Міф"],c:1,e:"Desktop — лише для Windows. На Mac користуються браузером (Power BI Service) або віртуальною машиною."},
  {q:"Power Query з’явився в Excel раніше, ніж у Power BI Desktop.",a:["Правда","Міф"],c:0,e:"Він вийшов як надбудова для Excel ще до появи Power BI Desktop."},
  {q:"Чим більше візуалів на сторінці, тим кращий дашборд.",a:["Правда","Міф"],c:1,e:"Зазвичай навпаки: фокус і простота працюють краще."},
  {q:"ШІ завжди пише правильні DAX-формули з першого разу.",a:["Правда","Міф"],c:1,e:"Формулу завжди потрібно перевіряти на тестових даних."}
 ]},
 {icon:"😅",title:"Життя розробника дашбордів",color:"#D9822B",t:20,mult:1,desc:"Гумор із впізнавання. Якщо вам це знайоме — ви в правильній команді.",qs:[
  {q:"Закінчи фразу: «Це займе п’ять хвилин…»",a:["…і все буде готово","…і три тижні","…і ми йдемо на обід","…і жодного слова більше"],c:1,e:"Класика жанру."},
  {q:"Закінчи фразу: «Можна просто додати ще один…»",a:["…звіт","…вихідний","…фільтр","…бюджет"],c:2,e:"Ще один фільтр — і це вже інший дашборд."},
  {q:"Закінчи фразу: «У мене на ноутбуці все працювало…»",a:["…а в Service ні","…а у вас ноутбук інший","…доки я не натиснув «Оновити»","…доки не прийшов замовник"],c:0,e:"Усі варіанти знайомі, але класика — перший."},
  {q:"Замовник каже: «Зробіть як в Excel, тільки гарніше». Ваша реакція?",poll:true,a:["😮‍💨 Глибокий вдих","📊 Показую Power BI","🛠️ Роблю по-своєму","☕ Іду по каву"],e:"Впізнаєте себе? 😄"},
  {q:"Цифри у двох звітах не збігаються. Що перевіряєте першим?",poll:true,a:["Фільтри","Джерело даних","Зв’язки між таблицями","«Раптом саме виправиться»"],e:"Правильної відповіді немає, але в кожного свій ритуал."},
  {q:"Скільки візуалів на вашій найперевантаженішій сторінці?",poll:true,a:["До 5","5–10","10–20","Краще не показувати"],e:"Ми вас не засуджуємо."},
  {q:"Замовник просить дашборд, який показує все. Що відповідаємо?",a:["«Добре, зроблю 40 візуалів»","«Які рішення ви приймете за його допомогою?»","«Це неможливо»","«Який у вас бюджет?»"],c:1,e:"Питання про рішення допомагає перетворити «все» на зрозуміле завдання."}
 ]},
 {icon:"🤖",title:"ШІ в нашій роботі",color:"#0A4FC4",t:25,mult:1,desc:"Як ми дружимо зі ШІ — і як не дати йому нас підвести.",qs:[
  {q:"Що таке Copilot у Power BI та Power Platform?",a:["Нова мова формул","ШІ-помічник для створення звітів, формул і пошуку відповідей у даних","Тип ліцензії","Антивірус"],c:1,e:"Copilot допомагає зі звітами, формулами й аналітикою. Доступність функцій залежить від ліцензії та налаштувань організації."},
  {q:"Який запит до ШІ дасть найкращий результат?",a:["«Зроби звіт»","«Допоможи»","«Поясни, як порахувати частку продажів за регіонами в Power BI: кроки та приклад формули»","«DAX»"],c:2,e:"Чітке завдання + контекст + бажаний формат."},

/* звук (лише в ведучого) */
let AC=null,MUTE=false;
function beep(f,d=.12,type='sine',v=.15,delay=0){
  if(MUTE)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const hostOnly=f=>()=>{if(S.role==='host'||S.role==='solo')f()};
const sfx={tick:hostOnly(()=>beep(880,.06,'square',.04)),reveal:hostOnly(()=>beep(520,.15,'triangle')),
  ok:hostOnly(()=>{beep(660,.12);beep(880,.2,'sine',.15,.12)}),time:hostOnly(()=>{beep(300,.25,'square',.07);beep(220,.35,'square',.07,.2)}),
  fan:hostOnly(()=>[523,659,784,1047].forEach((f,i)=>beep(f,.28,'triangle',.15,i*.15)))};
function toggleSound(){MUTE=!MUTE;$('snd').textContent=MUTE?'🔇':'🔊'}
function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
function confetti(){const cs=['#003DA5','#4F8BE8','#F2B705','#1DA57A','#ffffff'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='conf';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%cs.length]};width:${6+Math.random()*8}px;height:${10+Math.random()*10}px;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.2}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}}

/* спільні елементи інтерфейсу */
function qBody(m){return `<div class="q">${esc(m.q)}</div>`+(m.p?`<div class="prompt">${esc(m.p)}</div>`:'')}
function optsHTML(a,fn){return `<div class="opts">${a.map((o,k)=>fn
  ?`<button class="opt" id="o${k}" style="--oc:${COL[k%4]}" onclick="${fn}(${k})"><span class="l">${L[k]}</span>${esc(o)}</button>`
  :`<div class="opt" id="o${k}" style="--oc:${COL[k%4]}"><span class="l">${L[k]}</span>${esc(o)}</div>`).join('')}</div>`}
function lbHtml(list,me=-1){const mx=Math.max(1,...list.map(x=>x.s));
  return `<div class="lb">${list.map((x,k)=>`<div class="lbrow${k===me?' me':''}"><span class="rk">${x.r||k+1}</span><span class="nm">${esc(x.n)}</span><div class="lbbar"><i style="width:${x.s/mx*100}%"></i></div><b>${x.s}</b>${x.g?`<span class="plus">+${x.g}</span>`:''}</div>`).join('')}</div>`}
function pollHtml(a,counts,mine){const tot=counts.reduce((x,y)=>x+y,0)||1;
  return a.map((o,k)=>{const pc=Math.round(counts[k]/tot*100);return `<div class="pr${mine===k?' mine':''}"><div class="pbar" style="width:${pc}%"></div><span>${L[k]}. ${esc(o)}</span><b>${pc}%</b></div>`}).join('')}
function picker(){return `<label class="t">Блоки гри (зайві можна вимкнути)</label><div class="blocks">${BLOCKS.map((b,i)=>
  `<label class="bk" style="--acc:${b.color}"><input type="checkbox" class="bkc" value="${i}" checked onchange="est()"><span><b>${b.icon} ${esc(b.title)}</b><small>${b.qs.length} пит.${b.mult>1?' • ×'+b.mult:''}</small></span></label>`).join('')}</div>
  <p class="sub" id="est" style="font-size:15px"></p>`}
function est(){let n=0,s=0;document.querySelectorAll('.bkc:checked').forEach(x=>{const b=BLOCKS[+x.value];b.qs.forEach(q=>{n++;s+=(q.t||b.t)*.7+10})});
  $('est').textContent=`Обрано питань: ${n}, приблизно ${Math.round(s/60)} хв.`}
function buildList(){const sel=[...document.querySelectorAll('.bkc:checked')].map(x=>+x.value),list=[];
  BLOCKS.forEach((b,bi)=>{if(sel.includes(bi))b.qs.forEach(q=>list.push({...q,bi}))});return list}
const errCard=(msg,btns)=>`<div class="card" style="text-align:center"><div class="bigico">😕</div><h2>Щось пішло не так</h2><p class="sub">${msg}</p><div class="row" style="justify-content:center">${btns||'<button class="btn" onclick="home()">До меню</button>'}</div></div>`;
const mkCode=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
function killPeer(){if(S.peer){const p=S.peer;S.peer=null;try{p.destroy()}catch(e){}}}

function runTimer(onEnd){
  stop();const bar=$('bar'),fill=$('fill'),tm=$('tm');
  const tick=()=>{
    const ms=S.dl-Date.now(),left=Math.max(0,Math.ceil(ms/1000));
    tm.textContent='⏱ '+left;fill.style.width=Math.max(0,ms/(S.T*1000)*100)+'%';bar.classList.toggle('low',left<=5);
    if(left<=5&&left>0&&left!==S.ll)sfx.tick();S.ll=left;
    if(ms<=0){stop();onEnd()}
  };
  timer=setInterval(tick,200);tick();
}

    <button class="mode" onclick="joinScreen()"><div class="ic">📱</div><h3>Я гравець</h3><p>Є код кімнати? Заходьте й відповідайте зі свого пристрою.</p></button>

/* ================= ВЕДУЧИЙ ================= */
const answered=p=>p.ans!==null||p.txt!==null;
const send=(p,m)=>{if(p.conn&&p.conn.open){try{p.conn.send(m)}catch(e){}}};
const bcast=m=>Object.values(S.players).forEach(p=>send(p,m));
const ranking=()=>Object.values(S.players).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
const rankOf=p=>1+Object.values(S.players).filter(x=>x.score>p.score).length;
const topList=(n,g)=>ranking().slice(0,n).map(p=>({n:p.name,s:p.score,g:g?p.gain:0,r:rankOf(p)}));

function hostSetup(){
  app.innerHTML=`<div class="card"><h2>Створити кімнату</h2><p class="sub">Оберіть блоки гри.</p>${picker()}
   <div class="row"><button class="btn" onclick="hostCreate()">Створити кімнату</button><button class="btn ghost" onclick="home()">Назад</button></div></div>`;
  est();
}
function hostCreate(){
  if(typeof Peer==='undefined')return alert('Не завантажився модуль зв’язку (PeerJS). Перевірте інтернет і оновіть сторінку.');
  const list=buildList();if(!list.length)return alert('Оберіть хоча б один блок');
  S={role:'host',list,i:-1,players:{},phase:'lobby'};
  app.innerHTML='<div class="card" style="text-align:center"><div class="bigico">🛰️</div><h2>Створюємо кімнату…</h2></div>';
  openRoom(0);
}
function openRoom(n){
  const code=mkCode(),peer=new Peer(PFX+code,PCFG);S.peer=peer;
  peer.on('open',()=>{if(S.peer!==peer)return;S.code=code;hostLobby()});
  peer.on('connection',c=>{
    c.on('data',m=>hostMsg(c,m));
    c.on('close',()=>{const p=S.players&&S.players[c.pid];if(p&&p.conn===c){p.conn=null;refreshHost()}});
  });
  peer.on('disconnected',()=>{if(S.peer===peer){try{peer.reconnect()}catch(e){}}});
  peer.on('error',e=>{
    if(S.peer!==peer)return;
    if(e.type==='unavailable-id'&&n<5){try{peer.destroy()}catch(x){}return openRoom(n+1)}
    if(!S.code)app.innerHTML=errCard('Не вдалося створити кімнату ('+esc(e.type)+'). Можливо, мережа блокує з’єднання. Спробуйте іншу мережу.','<button class="btn" onclick="hostSetup()">Повторити</button><button class="btn ghost" onclick="home()">До меню</button>');
  });
}
function hostLobby(){
  S.phase='lobby';S.lastB={t:'lobby'};
  S.link=location.origin+location.pathname+'?room='+S.code;
  app.innerHTML=`<div class="card" style="text-align:center">
   <div class="kicker">Код кімнати</div><div class="code">${S.code}</div>
   <p class="sub">Надішліть посилання в чат дзвінка. Гравці відкриють його на телефоні або ноутбуці:</p>
   <div class="linkbox">${esc(S.link)}</div>
   ${location.protocol==='file:'?'<div class="expl">⚠️ Сторінку відкрито як локальний файл — в інших це посилання не запрацює. Відкрийте гру за адресою GitHub Pages.</div>':''}
   <div class="row" style="justify-content:center;margin:16px 0"><button class="btn ghost" onclick="copyLink(this)">📋 Скопіювати посилання</button></div>
   <h3 class="bh">У грі: <span id="pc">0</span></h3><div class="pl" id="pl" style="justify-content:center"></div>
   <div class="row" style="justify-content:center;margin-top:24px"><button class="btn" id="main" onclick="hostNext()">Почати гру</button>
   <button class="btn ghost" onclick="if(confirm('Закрити кімнату?'))home()">Скасувати</button></div></div>`;
  refreshHost();
}
function copyLink(b){navigator.clipboard.writeText(S.link).then(()=>b.textContent='Скопійовано ✓').catch(()=>prompt('Скопіюйте посилання:',S.link))}
function refreshHost(){
  const ps=Object.values(S.players||{});
  if(S.phase==='lobby'&&$('pl')){$('pc').textContent=ps.filter(p=>p.conn).length;
    $('pl').innerHTML=ps.map(p=>`<span class="${p.conn?'':'off'}">${esc(p.name)}</span>`).join('')||'<span class="off">поки нікого…</span>'}
  if(S.phase==='q'&&$('cnt')){const on=ps.filter(p=>p.conn);$('cnt').textContent='Відповіли: '+on.filter(answered).length+' / '+on.length}
}
function hostMsg(c,m){
  if(!m||!S.players)return;
  if(m.t==='hi'){
    const id=String(m.id).replace(/[^a-z0-9]/gi,'').slice(0,16)||'x';
    let p=S.players[id];
    if(!p){if(Object.keys(S.players).length>=MAXP){c.send({t:'full'});return}
      p=S.players[id]={name:'',score:0,ans:null,txt:null,at:0,gain:0,ok:false,aw:false,revmsg:null,str:0,maxStr:0,okc:0,minT:1e9}}
    p.name=String(m.name||'Гравець').slice(0,20);p.conn=c;c.pid=id;
    c.send({t:'ok'});hostSync(p);refreshHost();
  }else if(m.t==='ans'&&S.phase==='q'){
    const p=S.players[c.pid];if(!p||answered(p))return;
    const q=S.list[S.i],idx=S.i;p.at=(Date.now()-S.t0)/1000;
    if(q.a){const k=+m.k;if(!(k>=0&&k<q.a.length))return;p.ans=k}
    else{const v=String(m.v||'').trim().slice(0,200);if(!v)return;p.txt=v}
    send(p,{t:'got'});refreshHost();
    const on=Object.values(S.players).filter(x=>x.conn);
    if(on.length&&on.every(answered))setTimeout(()=>{if(S.phase==='q'&&S.i===idx)hostReveal()},800);
  }
}
function hostSync(p){
  let m;
  if(S.phase==='lobby'||S.phase==='intro')m=S.lastB;
  else if(S.phase==='q')m={...S.qmsg,left:Math.max(0,(S.dl-Date.now())/1000)};
  else if(S.phase==='rev')m=p.revmsg||{t:'wait'};
  else m=p.endmsg||{t:'wait'};
  send(p,m||{t:'lobby'});
  if(S.phase==='q'){if(answered(p))send(p,{t:'got'});if(S.hint)send(p,{t:'hint',h:S.list[S.i].h})}
}
function hostNext(){
  if(S.i===-1&&!Object.keys(S.players).length&&!confirm('Поки ніхто не підключився. Усе одно почати?'))return;
  S.i++;if(S.i>=S.list.length)return hostEnd();
  const q=S.list[S.i];(S.i===0||S.list[S.i-1].bi!==q.bi)?hostIntro(q):hostAsk();
}
function hostIntro(q){
  stop();S.phase='intro';
  const b=BLOCKS[q.bi],n=S.list.filter(x=>x.bi===q.bi).length,order=[...new Set(S.list.map(x=>x.bi))],no=order.indexOf(q.bi)+1;
  S.lastB={t:'intro',b:bInfo(b),desc:b.desc,n,no,of:order.length,top:S.i>0?topList(5,false):[]};bcast(S.lastB);
  app.innerHTML=`<div class="card intro" style="--acc:${b.color}">
   <div class="kicker">Блок ${no} з ${order.length}</div><div class="bigico">${b.icon}</div><h2>${esc(b.title)}</h2>
   ${b.mult>1?`<div class="mult">⭐ Бали ×${b.mult}</div>`:''}
   <p class="sub">${esc(b.desc)}<br><b>Питань: ${n}</b></p>
   ${S.i>0?`<h3 class="bh">Таблиця лідерів</h3>${lbHtml(topList(5,false))}`:''}
   <button class="btn" id="main" onclick="hostAsk()" style="margin-top:20px">Почати блок →</button></div>`;
  sfx.fan();
}
function hostAsk(){
  stop();const q=S.list[S.i],b=BLOCKS[q.bi],kind=kindOf(q);
  S.phase='q';S.T=tOf(q);S.t0=Date.now();S.dl=S.t0+S.T*1000;S.hint=false;
  Object.values(S.players).forEach(p=>{p.ans=null;p.txt=null;p.at=0;p.gain=0;p.ok=false;p.aw=false;p.revmsg=null});
  S.qmsg={t:'q',n:S.i+1,N:S.list.length,T:S.T,kind,b:bInfo(b),q:q.q,p:q.p||'',a:q.a||null};
  bcast({...S.qmsg,left:S.T});
  app.innerHTML=`<div class="card" style="--acc:${b.color}">
   <div class="top">${chip(bInfo(b))}<span>${S.i+1} / ${S.list.length}</span><span id="cnt"></span><span id="tm">⏱ ${S.T}</span></div>
   <div class="bar" id="bar"><i id="fill"></i></div>
   ${qBody(q)}
   ${kind==='poll'?'<div class="kicker" style="margin-bottom:10px">📊 Опитування — правильної відповіді немає</div>':''}
   <div id="qa">${q.a?optsHTML(q.a):'<div class="ansbox">✍️ Пишіть відповіді на своїх пристроях</div>'}</div>
   ${q.h?'<button class="btn ghost sm" id="hb" style="margin-top:14px" onclick="hostHint()">💡 Підказка</button>':''}
   <div id="hint"></div><div id="expl"></div><div id="after"></div>
   <div class="next"><button class="btn ghost" onclick="if(confirm('Закрити гру?'))home()">До меню</button>
   <button class="btn" id="main" onclick="hostReveal()">Показати відповідь</button></div></div>`;
  refreshHost();runTimer(()=>{sfx.time();hostReveal()});
}
function hostHint(){const q=S.list[S.i];S.hint=true;$('hint').innerHTML=`<div class="expl">💡 ${esc(q.h)}</div>`;$('hb').style.display='none';bcast({t:'hint',h:q.h})}
function openList(){
  const q=S.list[S.i],pts=BASE_PTS*mult(q),es=Object.entries(S.players).filter(([id,p])=>p.txt);
  return es.length?`<div class="alist">${es.map(([id,p])=>`<div class="ac"><div><b>${esc(p.name)}</b><br>${esc(p.txt)}</div><button class="btn sm ${p.aw?'on':''}" onclick="awardOpen('${id}')">${p.aw?'✓':'👍'} +${pts}</button></div>`).join('')}</div>`
    :'<p class="sub">Ніхто не надіслав відповідь 🤷</p>';
}
function awardOpen(id){
  const p=S.players[id],q=S.list[S.i],pts=BASE_PTS*mult(q);if(!p||S.phase!=='rev')return;
  if(p.aw){p.aw=false;p.gain-=pts;p.score-=pts}else{p.aw=true;p.gain+=pts;p.score+=pts;sfx.ok()}
  Object.values(S.players).forEach(x=>{const r=rankOf(x);
    if(x.revmsg){x.revmsg.gain=x.gain;x.revmsg.score=x.score;x.revmsg.rank=r}
    send(x,{t:'gain',gain:x.gain,score:x.score,rank:r})});
  $('qa').innerHTML=openList();$('after').innerHTML=`<h3 class="bh">Таблиця лідерів</h3>`+lbHtml(topList(5,true));
}
function hostReveal(){
  if(S.phase!=='q')return;
  stop();S.phase='rev';sfx.reveal();
  const q=S.list[S.i],kind=kindOf(q),mu=mult(q),ps=Object.values(S.players),cnt=q.a?q.a.map(()=>0):[];
  ps.forEach(p=>{
    p.ok=false;p.gain=0;
    if(q.a&&p.ans!==null){cnt[p.ans]++;
      if(kind==='quiz'&&p.ans===q.c){p.ok=true;p.gain=Math.round((BASE_PTS+BASE_PTS*.5*Math.max(0,S.T-p.at)/S.T)*mu);p.score+=p.gain;
        p.okc++;p.str++;p.maxStr=Math.max(p.maxStr,p.str);p.minT=Math.min(p.minT,p.at)}}
    if(kind==='quiz'&&!p.ok)p.str=0;
  });
  ps.forEach(p=>{p.revmsg={t:'rev',kind,a:q.a||null,counts:cnt,mine:p.ans,answered:answered(p),ok:p.ok,gain:p.gain,score:p.score,rank:rankOf(p),N:ps.length,
    ca:kind==='quiz'?q.a[q.c]:'',e:kind==='task'?'':(q.e||'')};send(p,p.revmsg)});
  if(kind==='quiz'){
    q.a.forEach((_,k)=>{const el=$('o'+k);el.classList.add(k===q.c?'correct':'dim');el.insertAdjacentHTML('beforeend',`<span class="cnt">${cnt[k]}</span>`)});
    $('after').innerHTML=`<h3 class="bh">Таблиця лідерів</h3>`+lbHtml(topList(5,true));
  }else if(kind==='poll'){
    $('qa').innerHTML=pollHtml(q.a,cnt,-1);
  }else{
    $('qa').innerHTML=openList();
    $('after').innerHTML=`<h3 class="bh">Таблиця лідерів</h3>`+lbHtml(topList(5,true));
  }
  if(q.e)$('expl').innerHTML=`<div class="expl">${kind==='task'?'🎯':'💡'} ${esc(q.e)}</div>`;
  const last=S.i===S.list.length-1,b=$('main');b.textContent=last?'Підсумки 🏆':'Далі →';b.onclick=hostNext;
  refreshHost();
}

/* ---------- фінал ---------- */
function noms(){
  const ps=Object.values(S.players),out=[],nq=S.list.filter(q=>kindOf(q)==='quiz').length;
  const f=ps.filter(p=>p.okc>0&&p.minT<1e9).sort((a,b)=>a.minT-b.minT)[0];
  if(f)out.push(['⚡','Найшвидший',f.name+' — '+f.minT.toFixed(1)+' с']);
  const s=ps.filter(p=>p.maxStr>=2).sort((a,b)=>b.maxStr-a.maxStr)[0];
  if(s)out.push(['🔥','Найдовша серія',s.name+' — '+s.maxStr+' поспіль']);
  const a=ps.filter(p=>p.okc>0).sort((x,y)=>y.okc-x.okc)[0];
  if(a)out.push(['🎯','Найбільше правильних',a.name+' — '+a.okc+' з '+nq]);
  return out.length?`<h3 class="bh">Номінації</h3><div class="noms">${out.map(o=>`<div class="nom"><div class="ni">${o[0]}</div><b>${o[1]}</b><span>${esc(o[2])}</span></div>`).join('')}</div>`:'';
}
function hostEnd(){
  stop();S.phase='end';const r=ranking(),top=topList(5,false);
  const win=(r.length&&r[0].score>0)?r.filter(p=>p.score===r[0].score):[];
  const wn=win.slice(0,3).map(p=>p.name).join(', ')+(win.length>3?' та ще '+(win.length-3):'');
  r.forEach(p=>{p.endmsg={t:'end',score:p.score,rank:rankOf(p),N:r.length,top,win:wn,tie:win.length>1};send(p,p.endmsg)});
  if(!r.length){app.innerHTML='<div class="card" style="text-align:center"><h2>Гру завершено</h2><p class="sub">Ніхто не грав 😅</p><button class="btn" onclick="home()">До меню</button></div>';return}
  S.fin={win,others:r.filter(p=>!win.includes(p)).slice(0,4)};
  const pod=[r[1],r[0],r[2]].map(t=>{if(!t)return '';const k=Math.min(rankOf(t),3);
    return `<div class="pod p${k}"><div style="font-size:30px">${['🥇','🥈','🥉'][k-1]}</div><div class="n">${esc(t.name)}</div><div class="s">${t.score}</div></div>`}).join('');
  app.innerHTML=`<div class="card" style="text-align:center">
   <h2>${win.length?(win.length>1?'🏆 Переможці: ':'🏆 Переможець: ')+esc(wn):'Гру завершено'}</h2>
   <p class="sub">${win.length>1?'Бали порівну — перемогу ділимо! ':''}Дякуємо за гру, Talent Hub!</p>
   ${win.length?`<div class="podium">${pod}</div>`:''}
   ${noms()}
   ${r.length>3?`<h3 class="bh" style="text-align:left">Усі учасники</h3>`+lbHtml(r.slice(3,10).map(p=>({n:p.name,s:p.score,g:0,r:rankOf(p)}))):''}
   <div class="row" style="justify-content:center;margin-top:24px">${win.length?'<button class="btn ghost" onclick="finaleStart()">🎬 Показати мультик ще раз</button>':''}<button class="btn" onclick="home()">До меню</button></div></div>`;
  if(win.length)finaleStart();else{sfx.fan()}
}

/* ---------- мультик-фінал: команда підкидає переможця ---------- */
let FV=null,FT=[];
function fvStop(){FT.forEach(t=>{clearTimeout(t);clearInterval(t)});FT=[]}
function fvClose(){fvStop();if(!FV)return;const r=FV;FV=null;r.classList.add('out');setTimeout(()=>r.remove(),500)}
function finaleStart(){
  if(!S.fin||!S.fin.win.length)return;
  fvClose();
  const ws=S.fin.win,oth=S.fin.others,two=ws.length>1;
  const raw=ws.slice(0,3).map(p=>p.name).join(' & ')+(ws.length>3?' …':'');
  const ttl=(two?'Переможці: ':'Переможець: ')+raw;
  const wpos=two?[36,53]:[44.5],tpos=[13,25,66,78];
  let team='',win='';
  for(let i=0;i<4;i++){const o=oth[i];team+=`<div class="w" style="left:${tpos[i]}cqw">${charSvg(PAL[(i+2)%PAL.length],'throw',i*.1)}${o?`<span class="nl">${esc(o.name.slice(0,12))}</span>`:''}</div>`}
  wpos.forEach((x,i)=>{win+=`<div class="w toss" style="left:${x}cqw;animation-delay:${i*.45}s">${charSvg(PAL[i],'up',0)}</div>`});
  const root=document.createElement('div');root.id='fv';root.className='ov';
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)root.classList.add('rm');
  root.innerHTML='<button class="skip">Пропустити ⏭</button><div class="st">'+
   '<div class="sc on dk" id="fv1"><div class="dr1">🥁</div><div class="dt" id="fvt">Підраховуємо бали…</div></div>'+
   '<div class="sc" id="fv2"><div class="gr"></div>'+
    '<span class="fl" style="left:6cqw;top:16cqw">⭐</span><span class="fl" style="right:6cqw;top:14cqw;animation-delay:-1s">🏆</span><span class="fl" style="left:12cqw;top:30cqw;animation-delay:-.5s">✨</span><span class="fl" style="right:12cqw;top:28cqw;animation-delay:-1.5s">🎉</span>'+
    '<div class="ban"><span>🏆 '+esc(ttl)+' 🏆</span></div><div class="blk"></div>'+team+win+'</div>'+
   '<div class="cap" id="fvcap" style="opacity:0"></div>'+
   '<button class="go" id="fvgo">Показати підсумки →</button></div>';
  document.body.appendChild(root);FV=root;
  root.addEventListener('click',e=>{
    if(e.target.classList.contains('skip'))fvClose();
    else if(e.target.id==='fvgo'){fvClose();confetti()}
  });
  const at=(ms,f)=>FT.push(setTimeout(f,ms));
  const dr=setInterval(()=>beep(75+Math.random()*30,.07,'sine',.25),110);FT.push(dr);
  at(1700,()=>{const t=document.getElementById('fvt');if(t)t.textContent='…і переможець!'});
  at(3000,()=>clearInterval(dr));
  at(3200,()=>{
    document.getElementById('fv1').classList.remove('on');document.getElementById('fv2').classList.add('on');
    const c=document.getElementById('fvcap');c.textContent='🎉 '+ttl+'! Підкидаємо всією командою!';c.style.opacity=1;
    sfx.fan();confetti();
  });
  at(11000,()=>{const g=document.getElementById('fvgo');if(g)g.classList.add('on')});
}
document.addEventListener('keydown',e=>{if(FV&&e.code==='Escape')fvClose()});

/* ================= ГРАВЕЦЬ ================= */
function joinScreen(code){
  document.body.classList.add('pl');
  app.innerHTML=`<div class="card"><h2>Вхід у гру</h2><p class="sub">Введіть ім’я, яке побачать колеги.</p>
   <label class="t">Ваше ім’я</label><input type="text" id="nm" maxlength="20" value="${esc(localStorage.getItem('thq_name')||'')}" placeholder="Наприклад, Аня">
   ${code?`<input type="hidden" id="cd" value="${esc(code)}">`:`<label class="t">Код кімнати</label><input type="text" id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:6px;font-weight:800">`}
   <div class="row"><button class="btn" onclick="joinGo()">Увійти</button><button class="btn ghost" onclick="home()">Назад</button></div></div>`;
}
function joinGo(){
  const name=$('nm').value.trim().slice(0,20),code=$('cd').value.trim().toUpperCase();
  if(!name||code.length!==4)return alert('Введіть ім’я та код кімнати (4 літери)');
  localStorage.setItem('thq_name',name);
  let pid=sessionStorage.getItem('thq_pid');if(!pid){pid=Math.random().toString(36).slice(2,10);sessionStorage.setItem('thq_pid',pid)}
  S={role:'player',name,code,pid};pConnect();
}
const pView=h=>{app.innerHTML=h};
const pCard=(inner)=>`<div class="card" style="text-align:center">${inner}</div>`;
function pFail(msg){stop();pView(errCard(msg,'<button class="btn" onclick="pConnect()">Спробувати знову</button><button class="btn ghost" onclick="home()">До меню</button>'))}
function pConnect(silent){
  if(typeof Peer==='undefined')return pView(errCard('Не завантажився модуль зв’язку. Перевірте інтернет і оновіть сторінку.'));
  if(!silent)pView(pCard('<div class="bigico">🔌</div><h2>Підключаємося…</h2>'));
  const old=S.peer;S.peer=null;try{old&&old.destroy()}catch(e){}
  const peer=new Peer(PCFG);S.peer=peer;S.ok=false;
  const to=setTimeout(()=>{if(!S.ok&&S.peer===peer)pFail('Не вдалося підключитися за 15 секунд. Перевірте код кімнати. З корпоративного ноутбука мережа може блокувати з’єднання — спробуйте телефон або особистий інтернет.')},15000);
  peer.on('error',e=>{
    if(S.peer!==peer)return;
    if(S.ok&&e.type!=='peer-unavailable')return;
    clearTimeout(to);
    pFail(e.type==='peer-unavailable'?'Кімнату не знайдено. Перевірте код або попросіть ведучого надіслати посилання знову.':'Помилка зв’язку ('+esc(e.type)+'). Спробуйте ще раз або змініть мережу.');
  });
  peer.on('open',()=>{
    if(S.peer!==peer)return;
    const c=peer.connect(PFX+S.code,{reliable:true});S.conn=c;
    c.on('open',()=>c.send({t:'hi',id:S.pid,name:S.name}));
    c.on('data',m=>{if(S.peer!==peer)return;if(m.t==='ok'){S.ok=true;clearTimeout(to);return}pMsg(m)});
    c.on('close',()=>{
      if(S.peer!==peer||S.over)return;S.ok=false;stop();
      pView(pCard('<div class="bigico">📡</div><h2>Зв’язок утрачено</h2><p class="sub">Перепідключаємося…</p>'));
      setTimeout(()=>{if(S.peer===peer&&!S.over)pConnect(true)},3000);
    });
  });
}
function psend(m){if(S.conn&&S.conn.open){S.conn.send(m);return true}return false}
function pMsg(m){
  if(m.t!=='hint'&&m.t!=='got'&&m.t!=='gain')stop();
  if(m.t!=='hint'&&m.t!=='got'&&m.t!=='gain')S.view=m.t;
  switch(m.t){
   case 'lobby':pView(pCard(`<div class="bigico">⏳</div><h2>Ви в грі, ${esc(S.name)}</h2><p class="sub">Чекаємо, поки ведучий почне. Можна налити кави ☕</p>`));break;
   case 'wait':pView(pCard('<div class="bigico">⏳</div><h2>Чекаємо наступне питання…</h2>'));break;
   case 'full':S.over=true;pView(pCard('<div class="bigico">🚫</div><h2>Кімната заповнена</h2><p class="sub">Попросіть ведучого допомогти.</p>'));break;
   case 'intro':pView(`<div class="card intro" style="--acc:${m.b.color}"><div class="kicker">Блок ${m.no} з ${m.of}</div><div class="bigico">${m.b.icon}</div><h2>${esc(m.b.title)}</h2>${m.b.mult>1?`<div class="mult">⭐ Бали ×${m.b.mult}</div>`:''}<p class="sub">${esc(m.desc)}</p>${m.top&&m.top.length?lbHtml(m.top):''}<div class="kicker">Дивіться на спільний екран</div></div>`);break;
   case 'q':pQ(m);break;
   case 'got':S.sent=true;pLock();if($('st'))$('st').innerHTML='<div class="expl">✓ Відповідь прийнято. Чекаємо на інших…</div>';break;
   case 'hint':if($('hint'))$('hint').innerHTML=`<div class="expl">💡 ${esc(m.h)}</div>`;break;
   case 'rev':S.rev=m;pRev(m);break;
   case 'gain':if(S.view==='rev'&&S.rev){S.rev={...S.rev,gain:m.gain,score:m.score,rank:m.rank};pRev(S.rev)}break;
   case 'end':pEnd(m);break;
  }
}
function pQ(m){
  S.T=m.T;S.dl=Date.now()+m.left*1000;S.sent=false;
  pView(`<div class="card" style="--acc:${m.b.color}">
   <div class="top">${chip(m.b)}<span>${m.n} / ${m.N}</span><span id="tm">⏱</span></div>
   <div class="bar" id="bar"><i id="fill"></i></div>
   ${qBody(m)}
   ${m.a?optsHTML(m.a,'pAns'):'<textarea id="tx" maxlength="200" placeholder="Ваша відповідь…"></textarea><button class="btn" id="sb" onclick="pText()">Надіслати</button>'}
   <div id="hint"></div><div id="st">${m.kind==='poll'?'<div class="kicker" style="margin-top:14px">📊 Опитування — правильної відповіді немає</div>':''}</div></div>`);
  runTimer(()=>{pLock();if(!S.sent&&$('st'))$('st').innerHTML='<div class="expl">⏰ Час вийшов — дивимося на екран ведучого</div>'});
}
function pLock(){document.querySelectorAll('.opt,#sb,#tx').forEach(e=>e.disabled=true)}
const noLink=()=>{$('st').innerHTML='<div class="expl">Немає зв’язку з ведучим. Зачекайте кілька секунд і натисніть ще раз.</div>'};
function pAns(k){
  if(S.sent)return;if(!psend({t:'ans',k}))return noLink();
  S.sent=true;pLock();$('o'+k).classList.add('sel');$('st').innerHTML='<div class="expl">📨 Надіслано…</div>';
}
function pText(){
  if(S.sent)return;const v=$('tx').value.trim();if(!v)return;
  if(!psend({t:'ans',v}))return noLink();S.sent=true;pLock();$('st').innerHTML='<div class="expl">📨 Надіслано…</div>';
}
function pRev(m){
  let icon,title;
  if(m.kind==='poll'){icon='📊';title=m.answered?'Дякуємо за голос!':'Ви не голосували'}
  else if(m.kind==='task'){icon=m.answered?'📨':'🤷';title=m.answered?'Відповідь отримано':'Ви не встигли'}
  else if(!m.answered){icon='⏰';title='Не встигли'}
  else if(m.ok){icon='✅';title='Правильно!'}
  else{icon='❌';title='Не цього разу'}
  pView(pCard(`<div class="res">${icon}</div><h2>${title}</h2>
   ${m.gain?`<div class="mult">+${m.gain} балів</div>`:''}
   ${m.kind==='quiz'?`<p class="sub">Правильна відповідь: <b>${esc(m.ca)}</b></p>`:''}
   ${m.kind==='poll'?`<div style="margin-bottom:10px">${pollHtml(m.a,m.counts,m.mine)}</div>`:''}
   ${m.kind==='task'&&!m.gain?'<p class="sub">Ведучий обирає найкращі відповіді 👀</p>':''}
   ${m.e?`<div class="expl">💡 ${esc(m.e)}</div>`:''}
   <div class="stand"><span>Усього: ${m.score}</span><span>Місце: ${m.rank} з ${m.N}</span></div>
   <p class="sub" style="margin-top:14px">Дивіться на спільний екран</p>`));
  if(m.ok)sfx.ok();
}
function pEnd(m){
  S.over=true;
  const ix=m.top?m.top.findIndex(x=>x.n===S.name&&x.s===m.score):-1;
  pView(pCard(`<div class="res">${['🥇','🥈','🥉'][m.rank-1]||'🎉'}</div><h2>Гру завершено</h2>
   ${m.win?`<p class="sub">${m.tie?'Переможці':'Переможець'}: <b>${esc(m.win)}</b> 🏆</p>`:''}
   <div class="big">${m.score}</div><p class="sub" style="margin-top:12px">Ваше місце: <b>${m.rank}</b> з ${m.N}. Дякуємо за гру!</p>
   ${m.top?lbHtml(m.top,ix):''}
   <button class="btn" onclick="home()">До меню</button>`));
  if(m.rank<=3)confetti();
}

/* ================= ЗАПУСК ================= */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)||S.role!=='host'||S.phase==='lobby'||FV)return;
  if(e.code==='Space'){e.preventDefault();if(document.activeElement)document.activeElement.blur();const m=$('main');if(m&&!m.disabled)m.click()}
});
window.addEventListener('beforeunload',e=>{if(S.role==='host'&&S.phase&&S.phase!=='lobby'){e.preventDefault();e.returnValue=''}});
const roomParam=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,4);
if(roomParam)joinScreen(roomParam);else home();
</script>

<script>

function note(f,d,v,type,delay){
